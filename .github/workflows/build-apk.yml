name: Build test APK

# Run from GitHub: Actions → "Build test APK" → Run workflow. Download the APK from the run's Artifacts.
# The APK uses mock billing and lets you type your test server's address on the welcome screen.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Default server address baked into the app (can be changed in the app)"
        required: false
        default: "http://192.168.1.20:4000"
  pull_request:
    paths:
      - .github/workflows/build-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALLOW_HTTP: "1"
      EXPO_PUBLIC_BILLING_MODE: mock
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'http://192.168.1.20:4000' }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: app/android
        # arm64 only: covers almost every phone from the last ~8 years and builds much faster.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ascend-protocol-test-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
