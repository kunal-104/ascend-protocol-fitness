services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ascend
      POSTGRES_DB: ascend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://ascend:ascend@db:5432/ascend
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
